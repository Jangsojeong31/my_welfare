spring:
  datasource:
    url: jdbc:h2:mem:welfare;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-jwt-secret-key-for-integration
  expiration-ms: 86400000

openai:
  api-key: test-key

welfare:
  open-api:
    service-key: test-key
