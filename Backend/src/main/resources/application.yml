server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:welfare}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  timeout-seconds: 60
  max-retries: 2

welfare:
  open-api:
    service-key: ${WELFARE_OPEN_API_KEY}
    list-call-tp: L
    detail-serv-cd: W001
    page-no: 1
    num-of-rows: 200
    max-pages: 10
    timeout-ms: 30000
    national-list-api-cd: NAW01
    national-detail-api-cd: NAW02
    local-list-api-cd: LCW01
    local-detail-api-cd: LCW02

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
